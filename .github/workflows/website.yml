name: Build MicroKeen website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            scripts/requirements-website.txt
      - run: python -m pip install -r scripts/requirements-website.txt
      - name: Test documentation audit paths
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test documentation search reset
        run: node --test scripts/test_docs_search_reset.cjs
      - name: Build and audit documentation
        run: |
          python -m mkdocs build --strict
          python scripts/audit_docs.py
      - name: Build website and bundled documentation
        run: python scripts/build_website.py
      - name: Audit the final bundled documentation
        run: python scripts/audit_docs.py --site-dir dist/docs --url-prefix /docs/
      - uses: actions/upload-artifact@v4
        with:
          name: microkeen-website
          path: dist/
          retention-days: 14
