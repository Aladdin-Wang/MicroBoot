# 主题配置
theme:
  name: material  # 使用 Material 主题
  features:
    - navigation.tabs  # 启用选项卡导航
    - navigation.indexes  # 启用索引导航
    - navigation.expand  # 默认展开烧录、运行观测、故障定位等二级目录
  palette:
    scheme: default
    primary: indigo
    accent: indigo
 
extra_css:
  - css/custom.css

extra_javascript:
  - https://fonts.googleapis.com/css?family=Fira+Code&display=swap
  
plugins:
  - search
  - awesome-pages

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - footnotes
  - def_list
  - admonition
  - codehilite:
      linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.critic
  - pymdownx.tasklist:
      custom_checkbox: true
      
# GitHub 仓库配置
repo_name: Aladdin-Wang/MicroBoot  # GitHub 用户名和仓库名称
repo_url: https://github.com/Aladdin-Wang/MicroBoot  # GitHub 仓库的 URL
edit_uri: ""  # 如果您的文档在仓库的根目录，可以留空


