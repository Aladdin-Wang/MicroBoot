markdown_extensions:
  - toc:
      permalink: true
  - tables
  - footnotes
  - def_list
  - admonition
  - codehilite:
      linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.critic
  - pymdownx.tasklist:
      custom_checkbox: true
      
# GitHub 仓库配置
